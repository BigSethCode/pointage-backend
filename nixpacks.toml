[phases.setup]
nixPkgs = ["php83", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.mysql", "php83Extensions.gd", "php83Extensions.zip"]

[phases.build]
cmds = ["composer install --no-dev --no-interaction --optimize-autoloader", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[phases.start]
cmds = ["php artisan migrate --force && php-fpm"]
